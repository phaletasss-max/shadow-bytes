upstream auth_service { server auth-service:8000; }
upstream user_service { server user-service:8000; }
upstream product_service { server product-service:8000; }
upstream order_service { server order-service:8000; }
upstream notification_service { server notification-service:8000; }
upstream reporting_service { server reporting-service:8000; }
upstream inventory_service { server inventory-service:8000; }
upstream payment_service { server payment-service:8000; }
upstream shipping_service { server shipping-service:8000; }

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;

    location = /health {
        default_type application/json;
        return 200 '{"service":"api-gateway","status":"UP"}';
    }

    location /api/auth/ {
        proxy_pass http://auth_service/;
    }

    location /api/users/ {
        proxy_pass http://user_service/;
    }

    location /api/products/ {
        proxy_pass http://product_service/;
    }

    location /api/orders/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://order_service/;
    }

    location /api/notifications/ {
        proxy_pass http://notification_service/;
    }

    location /api/reports/ {
        proxy_pass http://reporting_service/;
    }

    # Health endpoints are deliberately exposed only through these fixed routes.
    location = /api/monitor/auth { proxy_pass http://auth_service/health; }
    location = /api/monitor/users { proxy_pass http://user_service/health; }
    location = /api/monitor/products { proxy_pass http://product_service/health; }
    location = /api/monitor/orders { proxy_pass http://order_service/health; }
    location = /api/monitor/inventory { proxy_pass http://inventory_service/health; }
    location = /api/monitor/payments { proxy_pass http://payment_service/health; }
    location = /api/monitor/shipping { proxy_pass http://shipping_service/health; }
    location = /api/monitor/notifications { proxy_pass http://notification_service/health; }
    location = /api/monitor/reports { proxy_pass http://reporting_service/health; }

    location / {
        default_type application/json;
        return 404 '{"detail":"Use an /api route through the API Gateway."}';
    }
}

